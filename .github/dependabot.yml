# 🛰 hive-doctor: флот-стандарт улья — групповые месячные батчи
# (практика GitHub Blog 2026 «Tame Dependabot»: меньше шума, одна пачка на ревью).
version: 2
updates:
  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум Dependabot выключен (чистка аккаунта 2026-11-18) "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns: ["*"]

  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум Dependabot выключен (чистка аккаунта 2026-11-18) "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns: ["*"]
