# 🛰 hive-doctor: флот-стандарт улья — групповые месячные батчи
# (практика GitHub Blog 2026 «Tame Dependabot»: меньше шума, одна пачка на ревью).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns: ["*"]
